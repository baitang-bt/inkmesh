name: Deploy Cloudflare Worker

# 信令 + 公开大厅 Worker；静态站默认走 GitHub Pages。
# 手动触发时可顺带同步 Assets（workers.dev/inkmesh/ 镜像，非主入口）。
on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export static site
        run: python3 scripts/export-pages.py

      - name: Sync into Worker public assets
        run: bash scripts/sync-worker-public.sh

      - name: Deploy Worker (signal + lobby + optional assets mirror)
        working-directory: packages/ink-net/signal-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
