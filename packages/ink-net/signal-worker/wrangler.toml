name = "inkmesh-signal"
main = "src/index.js"
compatibility_date = "2024-12-01"

# 可选静态镜像（export-pages → public/inkmesh/）；公开入口默认 GitHub Pages。
# 本 Worker 主职：信令 WS + 公开大厅。
[assets]
directory = "./public"
binding = "ASSETS"
# 禁止 Assets 对 index.html ↔ 尾斜杠互跳；SPA 路由由 Worker 显式回退。
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

# 一房间一 Durable Object，跨 Isolate 共享房主登记。
[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

# 公开大厅目录（单例 idFromName('public')）。
[[durable_objects.bindings]]
name = "PUBLIC_LOBBY"
class_name = "PublicLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PublicLobby"]

# 可选：wrangler secret put LOBBY_HMAC
# 自定义域名（大陆访问）：Dashboard → Workers → Custom Domains
# [vars]
# LOBBY_HMAC = "change-me-in-production"
