name = "inkmesh-signal"
main = "src/index.js"
compatibility_date = "2024-12-01"

# 静态站（export-pages → public/inkmesh/）与信令 / 大厅同 Worker。
[assets]
directory = "./public"
binding = "ASSETS"
# 深链 /inkmesh/ROOMID 由 Worker fetch 里显式回退到 index.html。
run_worker_first = true

# 一房间一 Durable Object，跨 Isolate 共享房主登记。
[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

# 公开大厅目录（单例 idFromName('public')）。
[[durable_objects.bindings]]
name = "PUBLIC_LOBBY"
class_name = "PublicLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PublicLobby"]

# 可选：wrangler secret put LOBBY_HMAC
# 自定义域名（大陆访问）：Dashboard → Workers → Custom Domains
# [vars]
# LOBBY_HMAC = "change-me-in-production"
